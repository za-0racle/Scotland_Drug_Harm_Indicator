  <g id="text_21">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(18.72 555.035156)">Sources: NRS workbook covers; verified PHS original communications in outputs/communication_chronology.json.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(18.72 564.637344)">Annual intervals are registration periods, not availability or exact death dates. Updates are separately recorded in the chronology; no event-performance metric.</text>
