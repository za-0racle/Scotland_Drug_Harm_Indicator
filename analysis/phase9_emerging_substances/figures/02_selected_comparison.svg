  <g id="text_22">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(17.28 474.512969)">Source: NRS individual-substance workbook, 2024 edition (published 2 September 2025), SUB1a.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(17.28 484.115156)">Counts overlap across drugs; not prevalence, first discovery, causation or real-time warnings. Testing changed over time.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(17.28 493.717344)">Selection includes four requested substances plus etizolam, diazepam and isotonitazene for contextual contrast; bars are not additive.</text>
